name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: "! contains(toJSON(github.event.commits.*.message), '[ci skip]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Set build version
        shell: bash
        run: echo "APPBOT_VERSION=dev-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
      - name: Generate data
        run: ./gradlew runData
      - name: Build
        run: ./gradlew build
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: appbot-${{ github.run_number }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
